<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1040" viewBox="0 0 1500 1040">
<defs><style>
.title{font:700 29px Arial;fill:#17283b}.rowtitle{font:700 19px Arial;fill:#20364c}.step{font:700 14px Arial;fill:#fff}.txt{font:15px Arial;fill:#506276}.small{font:13px Arial;fill:#708095}.paneltitle{font:700 14px Arial;fill:#24384d}.paneltxt{font:12px Arial;fill:#728196}.btn{font:700 12px Arial;fill:#fff}.box{fill:#fff;stroke:#d7e0ea;stroke-width:2}.arrow{stroke:#8192a5;stroke-width:3;fill:none;marker-end:url(#arr)}
</style><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8192a5"/></marker></defs>
<rect width="100%" height="100%" fill="#f4f7fb"/>
<text x="50" y="55" class="title">Progressive adaptive dashboard — interaction storyboards</text>
<text x="50" y="85" class="small">Illustrated sequences based on the implemented browser prototype</text>
<text x="50" y="120" class="rowtitle">1  Recommendation and acceptance</text><text x="50" y="145" class="small">A new user has not yet established a stable preference. The system asks before it changes the layout.</text><rect x="50" y="165" width="410" height="205" rx="16" class="box"/><circle cx="76" cy="192" r="15" fill="#2864c8"/><text x="76" y="197" text-anchor="middle" class="step">1</text><rect x="545" y="165" width="410" height="205" rx="16" class="box"/><circle cx="571" cy="192" r="15" fill="#2864c8"/><text x="571" y="197" text-anchor="middle" class="step">2</text><rect x="1040" y="165" width="410" height="205" rx="16" class="box"/><circle cx="1066" cy="192" r="15" fill="#2864c8"/><text x="1066" y="197" text-anchor="middle" class="step">3</text><path d="M460 270 H530" class="arrow"/><path d="M955 270 H1025" class="arrow"/><text x="95" y="240" class="paneltitle">User action</text><text x="95" y="267" class="txt">Focus “Maintenance queue” twice.</text><rect x="95" y="277" width="300" height="52" rx="13" fill="#f7faff" stroke="#b6cafa" stroke-width="2"/><text x="111" y="304" class="paneltitle">Maintenance queue</text><text x="111" y="324" class="paneltxt">Focused 2 times this session</text><text x="590" y="240" class="paneltitle">System response</text><text x="590" y="267" class="txt">Explains the observed pattern.</text><rect x="590" y="277" width="300" height="52" rx="13" fill="#f7faff" stroke="#b6cafa" stroke-width="2"/><text x="606" y="304" class="paneltitle">Move Maintenance queue to top?</text><text x="606" y="324" class="paneltxt">Apply or keep current layout</text><text x="1085" y="240" class="paneltitle">User control</text><text x="1085" y="267" class="txt">Accepts the suggestion.</text><rect x="1085" y="277" width="300" height="52" rx="13" fill="#eaf7f4" stroke="#94cbbb" stroke-width="2"/><text x="1101" y="304" class="paneltitle">Layout updated</text><text x="1101" y="324" class="paneltxt">Maintenance queue moves to first</text><text x="50" y="420" class="rowtitle">2  Rejection and stability</text><text x="50" y="445" class="small">The user decides the suggestion is not useful. The layout remains unchanged and the prompt is suppressed for that session.</text><rect x="50" y="465" width="410" height="205" rx="16" class="box"/><circle cx="76" cy="492" r="15" fill="#2864c8"/><text x="76" y="497" text-anchor="middle" class="step">1</text><rect x="545" y="465" width="410" height="205" rx="16" class="box"/><circle cx="571" cy="492" r="15" fill="#2864c8"/><text x="571" y="497" text-anchor="middle" class="step">2</text><rect x="1040" y="465" width="410" height="205" rx="16" class="box"/><circle cx="1066" cy="492" r="15" fill="#2864c8"/><text x="1066" y="497" text-anchor="middle" class="step">3</text><path d="M460 570 H530" class="arrow"/><path d="M955 570 H1025" class="arrow"/><text x="95" y="540" class="paneltitle">User action</text><text x="95" y="567" class="txt">Focus “Throughput” twice.</text><rect x="95" y="577" width="300" height="52" rx="13" fill="#f7faff" stroke="#b6cafa" stroke-width="2"/><text x="111" y="604" class="paneltitle">Throughput</text><text x="111" y="624" class="paneltxt">Focused 2 times this session</text><text x="590" y="540" class="paneltitle">System response</text><text x="590" y="567" class="txt">Offers a reasoned recommendation.</text><rect x="590" y="577" width="300" height="52" rx="13" fill="#f7faff" stroke="#b6cafa" stroke-width="2"/><text x="606" y="604" class="paneltitle">Move Throughput to top?</text><text x="606" y="624" class="paneltxt">No change has happened yet</text><text x="1085" y="540" class="paneltitle">User control</text><text x="1085" y="567" class="txt">Chooses “Keep current layout”.</text><rect x="1085" y="577" width="300" height="52" rx="13" fill="#fff6e7" stroke="#edc47e" stroke-width="2"/><text x="1101" y="604" class="paneltitle">Suggestion dismissed</text><text x="1101" y="624" class="paneltxt">Existing panel order is preserved</text><text x="50" y="720" class="rowtitle">3  Learned automation and recovery</text><text x="50" y="745" class="small">After two accepted recommendations, the same low-risk change is applied automatically in a later session. Undo remains available.</text><rect x="50" y="765" width="410" height="205" rx="16" class="box"/><circle cx="76" cy="792" r="15" fill="#2864c8"/><text x="76" y="797" text-anchor="middle" class="step">1</text><rect x="545" y="765" width="410" height="205" rx="16" class="box"/><circle cx="571" cy="792" r="15" fill="#2864c8"/><text x="571" y="797" text-anchor="middle" class="step">2</text><rect x="1040" y="765" width="410" height="205" rx="16" class="box"/><circle cx="1066" cy="792" r="15" fill="#2864c8"/><text x="1066" y="797" text-anchor="middle" class="step">3</text><path d="M460 870 H530" class="arrow"/><path d="M955 870 H1025" class="arrow"/><text x="95" y="840" class="paneltitle">Learning across sessions</text><text x="95" y="867" class="txt">Two earlier suggestions were accepted.</text><rect x="95" y="877" width="300" height="52" rx="13" fill="#eaf7f4" stroke="#94cbbb" stroke-width="2"/><text x="111" y="904" class="paneltitle">Preference learned</text><text x="111" y="924" class="paneltxt">Same low-risk change accepted twice</text><text x="590" y="840" class="paneltitle">Automatic response</text><text x="590" y="867" class="txt">Next session: same focus pattern.</text><rect x="590" y="877" width="300" height="52" rx="13" fill="#eaf7f4" stroke="#94cbbb" stroke-width="2"/><text x="606" y="904" class="paneltitle">Automatic adjustment</text><text x="606" y="924" class="paneltxt">Panel moves to first position</text><text x="1085" y="840" class="paneltitle">Recovery and control</text><text x="1085" y="867" class="txt">Uses Undo or pauses automation.</text><rect x="1085" y="877" width="300" height="52" rx="13" fill="#f7faff" stroke="#b6cafa" stroke-width="2"/><text x="1101" y="904" class="paneltitle">Layout restored</text><text x="1101" y="924" class="paneltxt">Future change requires confirmation</text><text x="50" y="1010" class="small">All values and operational panels are illustrative. Storyboards describe prototype behaviour, not a deployed industrial system.</text></svg>